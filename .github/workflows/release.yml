# When you publish a GitHub release (tag like v0.2.0), builds the signed full and lite APKs and
# attaches them to it. "Run workflow" by hand builds the same files as a downloadable artifact,
# including the Play bundle (.aab). The signing key lives only in this repository's secrets:
#   HB_KEYSTORE_BASE64   the .jks file, base64-encoded
#   HB_KEYSTORE_PASSWORD, HB_KEY_ALIAS, HB_KEY_PASSWORD
name: Release
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Point Chaquopy at this Python
        run: sed -i "s|buildPython(\"/usr/bin/python3.12\")|buildPython(\"$(which python3.12)\")|" rns-python/build.gradle.kts
      - name: Android SDK parts
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358" "cmake;3.22.1" > /dev/null
      - name: Signing key
        env: { KEY: "${{ secrets.HB_KEYSTORE_BASE64 }}" }
        run: |
          if [ -n "$KEY" ]; then echo "$KEY" | base64 -d > "$RUNNER_TEMP/release.jks"; echo "HB_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"; fi
      - name: Build
        env:
          HB_KEYSTORE_PASSWORD: ${{ secrets.HB_KEYSTORE_PASSWORD }}
          HB_KEY_ALIAS: ${{ secrets.HB_KEY_ALIAS }}
          HB_KEY_PASSWORD: ${{ secrets.HB_KEY_PASSWORD }}
        run: ./gradlew --no-daemon :app:testLiteDebugUnitTest bundleLiteRelease assembleLiteRelease assembleFullRelease
      - name: Collect
        run: |
          mkdir out
          v="${GITHUB_REF_NAME#v}"; v="${v//\//-}"
          cp app/build/outputs/apk/full/release/*.apk "out/Highbridge-$v-full.apk"
          cp app/build/outputs/apk/lite/release/*.apk "out/Highbridge-$v-lite.apk"
          cp app/build/outputs/bundle/liteRelease/*.aab "out/Highbridge-$v-play.aab"
          rm -f "$RUNNER_TEMP/release.jks"
      - uses: actions/upload-artifact@v4
        with: { name: highbridge-release, path: out/ }
      - name: Attach to the release
        if: github.event_name == 'release'
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh release upload "${{ github.event.release.tag_name }}" out/*.apk --clobber
